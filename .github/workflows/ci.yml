name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t hive-exporter .
      - name: Smoke test (demo mode serves metrics)
        run: |
          docker run -d --name exporter -p 9986:9986 hive-exporter --demo
          for i in $(seq 1 15); do
            if curl -sf localhost:9986/metrics | grep -q "^hive_up 1.0"; then
              echo "metrics served OK"
              docker rm -f exporter
              exit 0
            fi
            sleep 2
          done
          echo "exporter never served metrics:"
          docker logs exporter
          exit 1
